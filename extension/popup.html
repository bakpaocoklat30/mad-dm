<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MAD-DM Integration</title>
  <style>
    :root {
      --bg: #070b16;
      --card: #0d1527;
      --border: #16243d;
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.3);
      --green: #00ff88;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-badge.online {
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: var(--green);
    }

    .status-badge.offline {
      background: rgba(255, 51, 102, 0.15);
      border: 1px solid rgba(255, 51, 102, 0.3);
      color: #ff3366;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 3px 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-icon:hover {
      color: #fff;
      border-color: var(--cyan);
    }

    /* Auto-Intercept Toggle Card */
    .intercept-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .intercept-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .intercept-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .intercept-desc {
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.3;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #1e293b;
      border: 1px solid #334155;
      transition: .25s ease-in-out;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #94a3b8;
      transition: .25s ease-in-out;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: rgba(0, 240, 255, 0.2);
      border-color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    /* Media Sniffer Box */
    .section-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .media-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 14px;
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .media-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #090f1d;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    .media-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
      font-family: var(--font-mono);
    }

    .btn-sniff-dl {
      background: var(--cyan);
      color: #000;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 10px;
      cursor: pointer;
    }

    .btn-sniff-dl:hover {
      filter: brightness(1.15);
    }

    .empty-media {
      color: var(--text-dim);
      font-size: 11px;
      text-align: center;
      padding: 8px 0;
    }

    /* Input & Action */
    .form-group {
      margin-bottom: 10px;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #fff;
      font-size: 12px;
      font-family: var(--font-mono);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .btn-submit {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #000;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 15px var(--cyan-glow);
      transition: all 0.15s;
    }

    .btn-submit:hover {
      filter: brightness(1.1);
    }

    .footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }

    .footer a {
      color: var(--cyan);
      text-decoration: none;
      font-family: var(--font-mono);
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ MAD-DM INTEGRATION</div>
    <div class="header-actions">
      <div id="statusBadge" class="status-badge offline">
        <div class="dot"></div>
        <span id="statusText">CONNECTING</span>
      </div>
      <button id="openOptionsBtn" class="btn-icon" title="Extension Settings">⚙️</button>
    </div>
  </div>

  <!-- Prominent Auto-Intercept Toggle Card -->
  <div class="intercept-card">
    <div class="intercept-info">
      <span class="intercept-title">
        <span>Auto-Download Interception</span>
      </span>
      <span class="intercept-desc" id="interceptStatusDesc">
        Disabled • Browser handles normal downloads
      </span>
    </div>
    <label class="switch">
      <input type="checkbox" id="autoInterceptToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-title">
    <span>DETECTED MEDIA ON TAB</span>
    <span id="mediaCount" style="color: var(--text-dim)">0 FOUND</span>
  </div>

  <div class="media-list" id="mediaContainer">
    <div class="empty-media">No streamable media detected on this tab.</div>
  </div>

  <div class="form-group">
    <input type="text" id="urlInput" placeholder="Paste link to download..." />
  </div>

  <button id="downloadBtn" class="btn-submit">⚡ DOWNLOAD (16 THREADS)</button>

  <div class="footer">
    <a href="#" id="openSettingsLink">Settings / Filter Extensions</a>
    <a href="http://localhost:17890" target="_blank">Open Desktop App ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
